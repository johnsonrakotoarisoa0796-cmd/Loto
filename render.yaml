services:
  - type: web
    name: loto-lab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Set this secret manually in Render to the Supabase PostgreSQL URI.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Loto 5/35 Bet261: lieu public indiqué à Antaninarenina.
      # Coordonnées approximatives du quartier, remplaçables après confirmation du site.
      - key: DRAW_TIME
        value: "16:35"
      - key: DRAW_TIMEZONE
        value: "Indian/Antananarivo"
      - key: DRAW_LOCATION_NAME
        value: "Antaninarenina, Antananarivo (approximatif)"
      - key: DRAW_LOCATION_LAT
        value: "-18.9103"
      - key: DRAW_LOCATION_LON
        value: "47.52502"
      - key: DRAW_LOCATION_IS_ESTIMATE
        value: "true"
      - key: SEISMIC_RADIUS_KM
        value: "200"
      - key: SEISMIC_MIN_MAGNITUDE
        value: "2.5"
