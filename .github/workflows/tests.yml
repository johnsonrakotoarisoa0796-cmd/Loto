name: Tests

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q app analysis_engine.py scientific_engine.py contextual_study.py contextual_predictor.py
      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js
